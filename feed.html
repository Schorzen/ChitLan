<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6D28D9">
<title>ChitLan — Community Feed</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">
<div class="app-shell">
  <header class="page-header">
    <h1 style="font-size:20px;" class="mb-0">Community Feed</h1>
  </header>

  <main class="page-content">
    <p class="text-muted" style="margin-top:-8px;">Ask if a booking's legit, share local news — posts disappear after 24 hours.</p>

    <div class="feed-filter-tabs">
      <button class="feed-filter-tab active" data-filter="all">All</button>
      <button class="feed-filter-tab" data-filter="question">Questions</button>
      <button class="feed-filter-tab" data-filter="chismis">Chismis</button>
    </div>

    <div id="feed-list">
      <div class="spinner" style="margin:0 auto;"></div>
    </div>
  </main>

  <button class="fab-new-post" id="new-post-fab" aria-label="New post"></button>
  <div id="tab-bar-mount"></div>
</div>

<script type="module" src="page-feed.js"></script>
</body>
</html>
