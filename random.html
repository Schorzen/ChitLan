<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6D28D9">
<title>ChitLan — RandomChat</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">
<div class="app-shell">
  <header class="page-header">
    <h1 style="font-size:20px;" class="mb-0" id="random-title">RandomChat</h1>
    <div class="live-pill" id="online-pill"><span class="live-dot"></span><span id="online-count" class="mono">--</span></div>
  </header>

  <main class="page-content" id="random-content" style="padding-bottom:calc(var(--nav-height) + 78px);"></main>

  <div class="chat-input-bar hidden" id="room-input-bar">
    <input type="text" id="room-input" placeholder="Say something…" maxlength="500" autocomplete="off">
    <button class="send-btn" id="room-send-btn" aria-label="Send message"></button>
  </div>

  <div id="tab-bar-mount"></div>
</div>

<script type="module" src="page-random.js"></script>
</body>
</html>
