<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2E1065">
<title>ChitLan — ChitChat in Island</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding-bottom: 0; background: var(--purple-dark); }
  .login-shell { min-height: 100vh; display: flex; flex-direction: column; }
  .login-top { padding: 72px var(--space-5) var(--space-6); text-align: center; }
  .login-top .wordmark { font-size: 36px; justify-content: center; margin-bottom: var(--space-2); }
  .login-top p { max-width: 280px; margin: 0 auto; }
  .login-sheet {
    flex: 1;
    background: var(--white);
    border-radius: 32px 32px 0 0;
    box-shadow: 0 -20px 40px rgba(0,0,0,0.15);
    padding: var(--space-6) var(--space-5) var(--space-6);
    text-align: center;
  }
  .step-icon-ring { margin-left: auto; margin-right: auto; }
  .g-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; background: var(--white); color: var(--ink);
    border: 1.5px solid var(--net-light); border-radius: var(--radius-pill);
    padding: 13px 20px; font-weight: 700; font-size: 15px;
    box-shadow: var(--shadow-sm);
  }
  .status-line { display:flex; align-items:center; gap:8px; justify-content:center; font-size: 13px; color: var(--net); margin-top: var(--space-3); }
  .fine-print { font-size: 11.5px; color: var(--net); margin-top: var(--space-4); line-height: 1.5; }
</style>
</head>
<body>

<div class="login-shell">
  <div class="login-top">
    <div class="wordmark wordmark-on-dark">Chit<span>Lan</span><span class="dot">.</span></div>
    <p>The community chat for Bantayan Island — locals and visitors both welcome.</p>
  </div>

  <div class="login-sheet" id="app-state">
    <div class="spinner" style="margin: var(--space-5) auto;"></div>
  </div>
</div>

<script type="module" src="page-index.js"></script>
</body>
</html>
