<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6D28D9">
<title>ChitLan — Profile</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
  <header class="page-header">
    <h1 style="font-size:20px;" class="mb-0">Profile</h1>
    <button class="btn-icon" id="signout-btn" aria-label="Sign out"></button>
  </header>

  <main class="page-content">

    <div class="card text-center">
      <div style="position:relative; width:84px; margin: 0 auto var(--space-3);">
        <div id="avatar-wrap"></div>
        <button class="btn-icon" id="change-photo-btn" style="position:absolute; bottom:-4px; right:-4px; width:32px; height:32px;" aria-label="Change photo"></button>
        <input type="file" id="photo-input" accept="image/*" class="hidden">
      </div>
      <div class="streak-chip" id="streak-chip-profile" style="margin-bottom: var(--space-2);"></div>
      <div id="badges-list-profile"></div>
    </div>

    <div class="card">
      <h3>Your details</h3>
      <div class="field">
        <label for="username-input">Username</label>
        <input type="text" id="username-input" maxlength="30" placeholder="How others see you">
      </div>
      <div class="field">
        <label for="birthday-input">Birthday</label>
        <input type="date" id="birthday-input">
      </div>
      <div class="field">
        <label for="gender-input">Gender</label>
        <select id="gender-input">
          <option value="">Prefer not to say</option>
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="nonbinary">Non-binary</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="bio-input">Bio</label>
        <textarea id="bio-input" rows="3" maxlength="160" placeholder="A little about you"></textarea>
      </div>
      <button class="btn btn-primary" id="save-btn">Save changes</button>
    </div>

  </main>

  <div id="tab-bar-mount"></div>
</div>

<script type="module" src="page-profile.js"></script>
</body>
</html>
