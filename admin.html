<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6D28D9">
<title>ChitLan — Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="is-loading">
<div class="app-shell">
  <header class="page-header">
    <h1 style="font-size:20px;" class="mb-0">Admin</h1>
  </header>

  <main class="page-content">

    <div class="card flex-between" id="stats-card">
      <div><span class="eyebrow">Total users</span><h2 id="stat-users" class="mb-0">–</h2></div>
      <div><span class="eyebrow">Messages stored</span><h2 id="stat-messages" class="mb-0">–</h2></div>
    </div>

    <div class="card">
      <h3>Open reports</h3>
      <div id="reports-list"><div class="spinner" style="margin:0 auto;"></div></div>
    </div>

    <div class="card">
      <h3>Manage users</h3>
      <div class="field mb-0">
        <label for="user-search-input">Search by exact username</label>
        <input type="text" id="user-search-input" placeholder="e.g. Juan Dela Cruz">
      </div>
      <button class="btn btn-outline btn-sm mt-2" id="user-search-btn">Search</button>
      <div id="user-search-results" class="mt-4"></div>
    </div>

    <div class="card">
      <h3>Daily Question</h3>
      <div class="field mb-0">
        <label for="daily-q-input">Today's question</label>
        <input type="text" id="daily-q-input" placeholder="Type a question…">
      </div>
      <button class="btn btn-secondary btn-sm mt-2" id="set-daily-q-btn">Set for today</button>
    </div>

    <div class="card">
      <h3>Trending Topics</h3>
      <div class="field mb-0">
        <label for="topic-input">Add a topic</label>
        <input type="text" id="topic-input" placeholder="e.g. Fiesta prep this weekend">
      </div>
      <button class="btn btn-secondary btn-sm mt-2" id="add-topic-btn">Add</button>
      <div id="topics-admin-list" class="mt-4"></div>
    </div>

  </main>

  <div id="tab-bar-mount"></div>
</div>

<script type="module" src="page-admin.js"></script>
</body>
</html>
